apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-gateway-config
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }

    http {
        server {
            listen 80;

            # Frontend Next.js app
            location / {
                proxy_pass http://frontend-service:3000;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            # User Service
            location /users/ {
                proxy_pass http://user-service:8000/users/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
            }
            
            # Additional path without trailing slash just in case
            location /users {
                proxy_pass http://user-service:8000/users;
                proxy_set_header Host $host;
            }

            # Event Service
            location /api/v1/ {
                proxy_pass http://event-service:8000/api/v1/;
                proxy_set_header Host $host;
            }
            
            location /api/v1 {
                proxy_pass http://event-service:8000/api/v1;
                proxy_set_header Host $host;
            }

            # Booking Service
            location /bookings/ {
                proxy_pass http://booking-service:8000/bookings/;
                proxy_set_header Host $host;
            }
            
            location /bookings {
                proxy_pass http://booking-service:8000/bookings;
                proxy_set_header Host $host;
            }

            # Payment Service
            location /payments/ {
                proxy_pass http://payment-service:8000/payments/;
                proxy_set_header Host $host;
            }
            
            location /payments {
                proxy_pass http://payment-service:8000/payments;
                proxy_set_header Host $host;
            }

            # Ticket Service
            location /tickets/ {
                proxy_pass http://ticket-service:8000/tickets/;
                proxy_set_header Host $host;
            }
            
            location /tickets {
                proxy_pass http://ticket-service:8000/tickets;
                proxy_set_header Host $host;
            }
        }
    }
