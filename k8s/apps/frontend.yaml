apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-ui
  labels:
    app: frontend-ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-ui
  template:
    metadata:
      labels:
        app: frontend-ui
    spec:
      containers:
      - name: frontend-ui
        image: frontend-ui:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        env:
        # These URLs must correctly hit the Ingress controller
        - name: NEXT_PUBLIC_USER_SERVICE_URL
          value: "/users"
        - name: NEXT_PUBLIC_EVENT_SERVICE_URL
          value: "/api/v1"
        - name: NEXT_PUBLIC_BOOKING_SERVICE_URL
          value: "/bookings"
        - name: NEXT_PUBLIC_PAYMENT_SERVICE_URL
          value: "/payments"
        - name: NEXT_PUBLIC_TICKET_SERVICE_URL
          value: "/tickets"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  selector:
    app: frontend-ui
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
